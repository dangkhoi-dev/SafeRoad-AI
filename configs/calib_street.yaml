# Điểm mốc hiệu chuẩn cho video đại lộ (Kaggle).
# Chạy lại: python -m saferoad calibrate --points configs/calib_street.yaml \
#   --frame data/processed/street/street_labeled_0_300s.mp4 \
#   --image docs/assets/calib_street.jpg --out data/outputs/calibration_street.json
source: Ước lượng từ vạch kẻ đường trên khung hình 150 của video đại lộ (Kaggle), KHÔNG đo thực địa. 16 điểm = 2
  đầu của 8 vạch đứt trên hai vạch phân làn kề nhau ở lòng đường bên trái; toạ độ pixel tinh chỉnh tự động theo
  tâm vạch sơn.
assumptions: ['Bề rộng làn 3,5 m (làn đường đô thị phổ biến 3,25-3,75 m)', 'Vạch đứt kiểu 1.5 (GOST R 51256): vạch
    3 m, khe 9 m, chu kỳ 12 m - tỉ lệ vạch/chu kỳ đo trên ảnh ≈ 0,24 khớp tỉ lệ 1:3', 'Pha của vạch thứ hai so với
    vạch thứ nhất giải bằng bình phương tối thiểu: -5,208 m', Mặt đường phẳng (homography một mặt phẳng), Sai số
    tỉ lệ tổng thể KHÔNG ảnh hưởng TTC và PET (cả quãng đường lẫn vận tốc cùng co giãn); ảnh hưởng ngưỡng khoảng
    cách và ngưỡng tốc độ tiếp cận]
